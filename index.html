<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Cat Airways | Contract Request</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 620px;

            background: #151515;
            border: 1px solid #292929;
            border-radius: 14px;

            padding: 35px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.55);
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e50914;
            border-radius: 50%;

            font-size: 31px;

            box-shadow: 0 0 25px rgba(229, 9, 20, 0.25);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
        }

        .red {
            color: #e50914;
        }

        /* NOTICE */

        .notice {
            background: #1b1112;
            border-left: 3px solid #e50914;

            padding: 13px;

            margin-bottom: 25px;

            border-radius: 5px;

            color: #bdbdbd;
            font-size: 13px;
            line-height: 1.5;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-size: 13px;
            font-weight: bold;

            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 13px;

            background: #0e0e0e;

            color: white;

            border: 1px solid #333;
            border-radius: 8px;

            outline: none;

            font-size: 14px;

            transition: 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #e50914;

            box-shadow:
                0 0 0 2px rgba(229, 9, 20, 0.10);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        /* AIRCRAFT CLASSES */

        .aircraft-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;
        }

        .aircraft-option input {
            display: none;
        }

        .aircraft-option label {
            margin: 0;

            padding: 13px 5px;

            text-align: center;

            background: #101010;

            border: 1px solid #333;

            border-radius: 8px;

            cursor: pointer;

            transition: 0.2s;
        }

        .aircraft-option label:hover {
            border-color: #e50914;
        }

        .aircraft-option input:checked + label {
            background: #e50914;
            border-color: #e50914;

            box-shadow:
                0 5px 15px rgba(229, 9, 20, 0.20);
        }

        /* BUTTON */

        .submit {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;
            border-radius: 8px;

            background: #e50914;

            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .submit:hover {
            background: #ff1a25;

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(229, 9, 20, 0.20);
        }

        .submit:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* STATUS */

        .status {
            display: none;

            margin-top: 18px;

            padding: 13px;

            border-radius: 7px;

            text-align: center;

            font-size: 13px;
        }

        .status.success {
            display: block;

            background: #102015;
            border: 1px solid #245c31;

            color: #78d88b;
        }

        .status.error {
            display: block;

            background: #241012;
            border: 1px solid #6b252b;

            color: #ff747d;
        }

        /* FOOTER */

        .footer {
            text-align: center;

            color: #555;

            font-size: 11px;

            margin-top: 22px;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .container {
                padding: 25px 20px;
            }

            .aircraft-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            🐱
        </div>

        <h1>
            The Cat Airways
        </h1>

        <p class="subtitle">
            World of Airports · Contract Request
        </p>

    </div>


    <!-- NOTICE -->

    <div class="notice">

        Please fill out all required information.
        Your request will be sent directly to
        <span class="red">The Cat Airways</span>.

    </div>


    <!-- FORM -->

    <form id="contractForm">


        <!-- DISCORD -->

        <div class="form-group">

            <label for="discord">
                Discord Username *
            </label>

            <input
                type="text"
                id="discord"
                placeholder="e.g. catpilot"
                required
            >

        </div>


        <!-- WOA -->

        <div class="form-group">

            <label for="ign">
                World of Airports Username *
            </label>

            <input
                type="text"
                id="ign"
                placeholder="Your WOA username"
                required
            >

        </div>


        <!-- AIRPORT -->

        <div class="form-group">

            <label for="airport">
                WOA Airport *
            </label>

            <input
                type="text"
                id="airport"
                placeholder="e.g. HKG"
                maxlength="4"
                style="text-transform: uppercase;"
                required
            >

        </div>


        <!-- AIRCRAFT CLASS -->

        <div class="form-group">

            <label>
                Aircraft Class *
            </label>

            <div class="aircraft-grid">


                <div class="aircraft-option">

                    <input
                        type="radio"
                        name="aircraftClass"
                        id="classA"
                        value="Class A"
                        required
                    >

                    <label for="classA">
                        Class A
                    </label>

                </div>


                <div class="aircraft-option">

                    <input
                        type="radio"
                        name="aircraftClass"
                        id="classB"
                        value="Class B"
                    >

                    <label for="classB">
                        Class B
                    </label>

                </div>


                <div class="aircraft-option">

                    <input
                        type="radio"
                        name="aircraftClass"
                        id="classC"
                        value="Class C"
                    >

                    <label for="classC">
                        Class C
                    </label>

                </div>


                <div class="aircraft-option">

                    <input
                        type="radio"
                        name="aircraftClass"
                        id="classD"
                        value="Class D"
                    >

                    <label for="classD">
                        Class D
                    </label>

                </div>


                <div class="aircraft-option">

                    <input
                        type="radio"
                        name="aircraftClass"
                        id="classE"
                        value="Class E"
                    >

                    <label for="classE">
                        Class E
                    </label>

                </div>


                <div class="aircraft-option">

                    <input
                        type="radio"
                        name="aircraftClass"
                        id="classF"
                        value="Class F"
                    >

                    <label for="classF">
                        Class F
                    </label>

                </div>

            </div>

        </div>


        <!-- NUMBER -->

        <div class="form-group">

            <label for="amount">
                Number of Contracts *
            </label>

            <select id="amount" required>

                <option value="">
                    Select amount
                </option>

                <option value="1">
                    1 Contract
                </option>

                <option value="3">
                    3 Contracts
                </option>

                <option value="5">
                    5 Contracts
                </option>

            </select>

        </div>


        <!-- NOTES -->

        <div class="form-group">

            <label for="notes">
                Additional Information
            </label>

            <textarea
                id="notes"
                placeholder="Optional notes..."
            ></textarea>

        </div>


        <!-- SUBMIT -->

        <button
            class="submit"
            id="submitButton"
            type="submit"
        >
            SUBMIT CONTRACT REQUEST
        </button>


    </form>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    ></div>


    <!-- FOOTER -->

    <div class="footer">

        © 2026 The Cat Airways · World of Airports

    </div>

</div>


<script>

    /*
    =====================================================
    DISCORD WEBHOOK
    =====================================================

    PASTE YOUR DISCORD WEBHOOK URL BELOW.

    Example:

    const WEBHOOK_URL =
        "https://discord.com/api/webhooks/....";

    =====================================================
    */

    const WEBHOOK_URL =
        "https://discord.com/api/webhooks/1550819946315915395/Kh9HFukAXqFollQkFLGNS2KvGwlrH5_m8UP8JLsADb_NuojfRezpou5n___jmqBvdi2T";


    const form =
        document.getElementById("contractForm");

    const button =
        document.getElementById("submitButton");

    const status =
        document.getElementById("status");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        /*
        GET FORM DATA
        */

        const discord =
            document.getElementById("discord").value.trim();

        const ign =
            document.getElementById("ign").value.trim();

        const airport =
            document.getElementById("airport").value
            .trim()
            .toUpperCase();

        const aircraftClass =
            document.querySelector(
                'input[name="aircraftClass"]:checked'
            ).value;

        const amount =
            document.getElementById("amount").value;

        const notes =
            document.getElementById("notes").value.trim();


        /*
        CHECK WEBHOOK
        */

        if (
            WEBHOOK_URL ===
            "PASTE_YOUR_DISCORD_WEBHOOK_HERE"
        ) {

            showStatus(
                "error",
                "Discord webhook is not configured yet."
            );

            return;
        }


        /*
        DISABLE BUTTON
        */

        button.disabled = true;

        button.textContent =
            "SENDING REQUEST...";


        /*
        CREATE DISCORD EMBED
        */

        const payload = {

            username:
                "The Cat Airways",

            avatar_url:
                "https://cdn-icons-png.flaticon.com/512/616/616430.png",

            embeds: [

                {

                    title:
                        "🐱 NEW CONTRACT REQUEST",

                    description:
                        "A new World of Airports contract request has been submitted.",

                    color:
                        15142420,

                    fields: [

                        {
                            name:
                                "👤 Discord",
                            value:
                                "```" +
                                discord +
                                "```",
                            inline:
                                true
                        },

                        {
                            name:
                                "🎮 WOA Username",
                            value:
                                "```" +
                                ign +
                                "```",
                            inline:
                                true
                        },

                        {
                            name:
                                "🛫 Airport",
                            value:
                                "**" +
                                airport +
                                "**",
                            inline:
                                true
                        },

                        {
                            name:
                                "✈️ Aircraft Class",
                            value:
                                "**" +
                                aircraftClass +
                                "**",
                            inline:
                                true
                        },

                        {
                            name:
                                "📦 Contracts",
                            value:
                                "**" +
                                amount +
                                "**",
                            inline:
                                true
                        },

                        {
                            name:
                                "📝 Additional Information",
                            value:
                                notes ||
                                "No additional information provided.",
                            inline:
                                false
                        }

                    ],

                    footer: {

                        text:
                            "The Cat Airways • World of Airports"

                    },

                    timestamp:
                        new Date().toISOString()

                }

            ]

        };


        /*
        SEND TO DISCORD
        */

        try {

            const response =
                await fetch(
                    WEBHOOK_URL,
                    {

                        method:
                            "POST",

                        headers:
                            {
                                "Content-Type":
                                    "application/json"
                            },

                        body:
                            JSON.stringify(payload)

                    }
                );


            /*
            SUCCESS
            */

            if (response.ok) {

                showStatus(
                    "success",
                    "✓ Contract request successfully submitted!"
                );

                form.reset();

            }


            /*
            ERROR
            */

            else {

                throw new Error(
                    "Discord returned an error."
                );

            }

        }

        catch (error) {

            console.error(error);

            showStatus(
                "error",
                "✕ Something went wrong. Please try again."
            );

        }


        /*
        ENABLE BUTTON AGAIN
        */

        button.disabled = false;

        button.textContent =
            "SUBMIT CONTRACT REQUEST";

    });


    /*
    STATUS MESSAGE
    */

    function showStatus(type, message) {

        status.className =
            "status " + type;

        status.textContent =
            message;

    }


    /*
    AUTOMATICALLY UPPERCASE AIRPORT
    */

    document
        .getElementById("airport")
        .addEventListener(
            "input",
            function() {

                this.value =
                    this.value.toUpperCase();

            }
        );

</script>

</body>
</html>
